<!DOCTYPE html>
<html>
	<head>
		<title>OpenEarthViewer</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="css/styles.css" type="text/css" />
		<script type="importmap">
			{
				"imports": {
					"three": "./app/vendor/three.webgl.js",
					"bvh.js": "./app/vendor/bvh.js",
					"three/addons/utils/SortUtils.js": "./app/vendor/SortUtils.js"
				}
			}
		</script>
		<script src="app/vendor/rStats.js"></script>
		<script src="app/vendor/straight-skeleton.js"></script>
		<script src="client/appClient.js" type="module"></script>

		<!-- rollup js/app.js --format iife --name "oev" --file oev.js -->
		<!-- <script src="js/oev-bundle.js"></script> -->
	</head>

	
	<body>
		<div id="modalContainer">
			<div id="modalWindow">
				<a href="#" onclick="closeModal();"><img src="img/ico_close.png" alt="close" title="close"></a>
				<div id="modalContent">
				
				</div>
			</div>
		</div>
		
		<div id="header">OpenEarthViewer</div>
		<div id="main">
			
			<div id="threeContainer">
				Scale : <input id="perlinScale" type="range" value="0.016" step="0.001" min="0.001" max="0.1">
				OctavesCount : <input id="octavesCount" type="range" value="4" step="1" min="1" max="5">
				Persistence : <input id="persistence" type="range" value="0.79" step="0.01" min="0.0" max="1.0">
				CutValue : <input id="cutValue" type="range" value="0.2" step="0.01" min="0.0" max="1.0">

				<div class="overlayUI" id="overlayUICoords">
				</div>
				<div class="overlayUI" id="overlayCurtile">
				</div>
				<div class="overlayUI" id="overlayNavigation">
				</div>
				<div class="overlayUI" id="overlayExtensions">
				</div>
				<div class="overlayUI" id="overlayExtensionsUi">
				</div>
				<div class="overlayUI" id="overlayWaypoints">
					<!-- <div class="btn" id="btn-saveWaypoint" title="Save current location">Add waypoint</div> -->
					<div id="waypointsInfos"></div>
				</div>
			</div>

		</div>

		<script>
			window.addEventListener('load', evt => {
				APP.init('threeContainer', {
					waypoints : [
						{lon : 4.231021, lat : 43.795594, ele : 13, name : 'Vaunage'}, 
						{lon : 3.854188, lat : 43.958125, ele : 13, name : 'St Hippo'}, 
						{lon : 3.8139, lat : 43.7925, ele : 13, name : 'Pic St Loup'}, 
						{lon : 5.2659, lat : 44.1747, ele : 13, name : 'Mt Ventoux'}, 
						{lon : 5.7333, lat : 43.1637, ele : 14, name : 'St Cyr'}, 
						{lon : 2.383138, lat : 48.880945, ele : 13, name : 'Paris'}, 
						{lon : 4.2814, lat : 44.1302, ele : 14, name : 'Mont Bouquet'},
						{lon : 3.549, lat : 44.096, ele : 14, name : 'Mont Aigoual'},
						{lon : -112.4902, lat : 36.3443, ele : 13, name : 'Grand Canyon'},
					], 

					OEV : {
						CAMERA : {
							x : 4.1862,
							y : 43.7682,
							z : 12,
						}, 
						UI : {
							extensions : true, 
							waypoints : true, 
							navigation : true, 
						}, 
						URL : {
							// enabled : true,
						}, 
						EXTENSIONS : {
							// elevation : {
								// active : false, 
							// }
						}, 
					}, 
				});
			})
			
		</script>
	</body>
</html>
